# Render Blueprint for the hosted demo (free plan, no payment method needed).
# Render > New > Blueprint > pick this repo; it asks for every `sync: false` value.
# Full walkthrough and the Section 11 table: docs/deploy/cloud.md
services:
  - type: web
    name: safety-twin
    runtime: docker
    plan: free
    region: singapore  # nearest to India; cannot be changed later
    branch: feat/cv-pipeline
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    # Deploy only after GitHub Actions CI passes. Render never auto-deploys a commit with zero
    # checks, so enable Actions on the fork first (or use `commit` to deploy on every push).
    autoDeployTrigger: checksPass
    envVars:
      - key: SAFETY_RUNS_REPO  # Hugging Face dataset with published runs
        sync: false
      - key: HF_TOKEN  # private datasets; needs WRITE access when uploads are enabled
        sync: false
      - key: SAFETY_LLM_PROVIDER
        value: gemini
      - key: SAFETY_LLM_API_KEY  # Google AI Studio key (free tier)
        sync: false
      - key: SAFETY_CHAT_PER_MINUTE
        value: "8"
      - key: SUPABASE_URL  # optional: chat logs and reviews
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      # Video uploads (optional): queued in a private inbox dataset, processed by
      # tools/worker.py on the GPU workstation. Leave unset to keep uploads off.
      - key: SAFETY_INBOX_REPO  # e.g. <user>/safety-twin-inbox
        sync: false
      - key: SAFETY_UPLOAD_CODE  # access code shared with uploaders
        sync: false
      - key: SAFETY_WORKER_KEY  # long random secret; the worker sends it with each heartbeat
        sync: false
