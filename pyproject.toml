[project]
name = "construction-safety-twin"
version = "0.1.0"
description = "Offline construction-safety video analysis with a 2.5D situational twin"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy>=2.1,<3",
  "opencv-python>=4.10,<6",
  "pydantic>=2.12,<3",
  "pyyaml>=6,<7",
  "rich>=14,<15",
  "scipy>=1.14,<2",
  "shapely>=2.0,<3",
  "typer>=0.16,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "jobs", "pipeline", "twin", "shared", "llm", "tools", "evaluation"]

# Model runtimes stay out of the base install so CI does not download torch.
# Windows resolves torch from the CUDA 12.8 index (Turing GPUs, driver >= 528);
# macOS and Linux use the default PyPI wheels (MPS / CPU).
[project.optional-dependencies]
vision = [
  "lap>=0.5.12,<1",  # ByteTrack assignment; declared so Ultralytics never pip-installs at runtime
  "torch>=2.10,<2.12",
  "torchvision>=0.25,<0.27",
  "ultralytics>=8.4.163,<8.5",
]
# One-time build of the open-vocabulary detector's class embeddings (YOLOE text prompts).
# Runtime loads the saved model and never needs these.
openvocab = [
  "clip",
  "ftfy>=6,<7",
]
# Incident-narration LLM (L4): LoRA fine-tuning and inference with Hugging Face on
# CUDA/MPS/CPU. The M1 teammates may use MLX instead; the corpus and evaluation are shared.
narration = [
  "accelerate>=1.10,<2",
  "peft>=0.17,<1",
  "transformers>=4.57,<6",
]
report = [
  "pandas>=2.2,<3",
  "pyarrow>=17,<23",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "pytest-cov>=7,<8",
  "ruff==0.14.4",
  "types-pyyaml>=6,<7",
]

[tool.uv.sources]
clip = { git = "https://github.com/ultralytics/CLIP.git" }
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[project.scripts]
safety-twin = "app.__main__:main"
safety-tools = "tools.cli:main"
safety-llm = "llm.cli:main"
safety-eval = "evaluation.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
  "tools/cctv.py",
  "tools/fetch_sard.py",
  "tools/profile_sard.py",
  "tools/profile_yolo.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
